[General]
; DirectInput scan code (DIK_*) of the key that toggles the quest tracker
; overlay. Default 64 (0x40) = F6. Common alternatives:
;   F7 = 65, F8 = 66, Insert = 210, Home = 199
ToggleKey=64

; Refresh the quest list automatically every N seconds while the overlay
; is open (0 disables auto-refresh; the Refresh button always works).
AutoRefreshSeconds=2
