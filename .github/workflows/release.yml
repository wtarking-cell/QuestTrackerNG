name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Update vcpkg registry
        shell: pwsh
        run: git -C $env:VCPKG_INSTALLATION_ROOT fetch origin master

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset release-ninja

      - name: Package
        shell: pwsh
        run: python scripts/package.py --dist build/dist --out "QuestTrackerNG-${{ github.ref_name }}.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "QuestTrackerNG-${{ github.ref_name }}.zip"
          --title "QuestTrackerNG ${{ github.ref_name }}"
          -