name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Update vcpkg registry
        shell: pwsh
        run: git -C $env:VCPKG_INSTALLATION_ROOT fetch origin master

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset release-ninja

      - name: Package
        shell: pwsh
        run: python scripts/package.py --dist build/dist --out "QuestTrackerNG-${{ github.ref_name }}.zip"

      - name: Upload release zip as artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuestTrackerNG-${{ github.ref_name }}
          path: QuestTrackerNG-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          ZIP="QuestTrackerNG-${TAG}.zip"
          gh release create "$TAG" "$ZIP" \
            --title "QuestTrackerNG ${TAG}" \
            --generate-notes \
          || gh release upload "$TAG" "$ZIP" --clobber
