name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Node 24 becomes the forced default on 2026-06-16; opt in now so
  # community actions (ilammy/msvc-dev-cmd) run the same way before and after.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  logic-tests:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S tests -B build-tests -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-tests

      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  plugin:
    name: SKSE plugin (MSVC)
    runs-on: windows-latest
    needs: logic-tests
    steps:
      - uses: actions/checkout@v6

      - name: Point at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # The preinstalled vcpkg clone may predate the baseline commit pinned
      # in vcpkg.json; fetch master so the baseline is resolvable.
      - name: Update vcpkg registry
        shell: pwsh
        run: git -C $env:VCPKG_INSTALLATION_ROOT fetch origin master

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ninja-ci

      - name: Build
        run: cmake --build --preset ci

      - name: Package
        shell: pwsh
        run: python scripts/package.py --dist build/dist --out QuestTrackerNG.zip

      - name: Upload mod package
        uses: actions/upload-artifact@v7
        with:
          name: QuestTrackerNG
          path: |
            QuestTrackerNG.zip
            build/dist/
          if-no-files-found: error
